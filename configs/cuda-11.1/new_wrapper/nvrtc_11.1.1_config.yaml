  - source_function: nvrtcCompileProgram
    target_function: hgrtcCompileProgram
    parameter_mapping:
      {}
    in_func_custom_code:
      pre_wrapper_call: |
        const char* optionsExtra[] =  {
                "-D__CUDACC__", // for padding
                "--rtc-compatible-mode",
                "-D__CUDACC__",
                "-D__CUDA__",
                "-D__CUDACC_VER_MAJOR__=11",
                "-D__CUDACC_VER_MINOR__=1",
                "-D__CUDACC_VER_BUILD__=1",
                "-DCUDART_VERSION=11010",
                "-D__CUDACC_RTC__",
                "-D__CUDA_RUNTIME_H__",
                "-U__linux__"
            };
            const int numOptionsExtra = sizeof(optionsExtra) / sizeof(optionsExtra[0]);

            int newSize = numOptions + numOptionsExtra;
            char** newOptions = (char**)malloc(newSize * sizeof(char*));

            for (int i = 0; i < numOptions; i++) {
                const char *opti = options[i];
                if (strcmp(opti, "--gpu-architecture=compute_90a") == 0 || strcmp(opti, "-arch=compute_90a") == 0 ||
                    strcmp(opti, "--gpu-architecture=sm_90a") == 0 || strcmp(opti, "-arch=sm_90a") == 0) {
                #if 0
                    
                #endif
                } else if (strcmp(opti, "--gpu-architecture=compute_89") == 0 || strcmp(opti, "-arch=compute_89") == 0 ||
                           strcmp(opti, "--gpu-architecture=sm_89") == 0 || strcmp(opti, "-arch=sm_89") == 0) {
                #if 1 || 0
                    optionsExtra[0]="--ppu-arch=ppu0015";
                #endif
                } else if (strcmp(opti, "--gpu-architecture=compute_80") == 0 || strcmp(opti, "-arch=compute_80") == 0 ||
                           strcmp(opti, "--gpu-architecture=sm_80") == 0 || strcmp(opti, "-arch=sm_80") == 0) {
                    optionsExtra[0]="--ppu-arch=ppu001";
                }
                newOptions[i + numOptionsExtra] = strdup(opti);
            }

            for (int i = 0; i < numOptionsExtra; i++) {
                newOptions[i] = strdup(optionsExtra[i]);
            }

            options = newOptions;
            numOptions = newSize;


            bool needProfile = g_profileHandler.isCallbackEnabled != NULL &&
                g_profileHandler.isCallbackEnabled(g_profileDomain, nvrtc_TRACE_CBID_nvrtcCompileProgram) != 0;
            if (needProfile) {
                g_profileHandler.profileCallbackBegin(g_profileDomain, nvrtc_TRACE_CBID_nvrtcCompileProgram);
            }

      post_wrapper_call: |
        if (needProfile) {
                g_profileHandler.profileCallbackEnd(g_profileDomain, nvrtc_TRACE_CBID_nvrtcCompileProgram);
            }

        for (int i = 0; i < newSize; i++) {
                    free(newOptions[i]);
                }
                free(newOptions);

