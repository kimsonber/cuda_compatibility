  - source_function: nvrtcVersion
    target_function: ""
    parameter_mapping:
      {}
    custom_func_imp: "nvrtcResult nvrtcVersion(int * major, int * minor) {\n    // TraceCall(\"nvrtcVersion\");\n    if (major == NULL || minor == NULL) {\n      return NVRTC_ERROR_INVALID_INPUT;\n    }\n    *major = CUDA_VERSION / 1000;\n    *minor = (CUDA_VERSION - (*major * 1000)) / 10;\n    return NVRTC_SUCCESS;\n}\n\n"
