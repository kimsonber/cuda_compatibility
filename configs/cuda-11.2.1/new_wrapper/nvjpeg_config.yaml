    custom_func_imp: "nvjpegStatus_t nvjpegGetCudartProperty(libraryPropertyType type, int * value) {\n    // TraceCall(\"nvjpegGetCudartProperty\");\n    if(type == MAJOR_VERSION) {\n        *value = CUDART_VERSION / 1000;\n    } else if (type == MINOR_VERSION) {\n        *value = (CUDART_VERSION % 1000) / 10;\n    } else if (type == PATCH_LEVEL) {\n        *value = CUDART_VERSION % 10;\n    } else {\n        printf(\"Unknown library property type: %d\\n\", type);\n        return NVJPEG_STATUS_JPEG_NOT_SUPPORTED;\n    }\n    return NVJPEG_STATUS_SUCCESS;\n}\n\n"
