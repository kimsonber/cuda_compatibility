    custom_func_imp: "CUresult cuGetProcAddress(const char * symbol, void ** pfn, int cudaVersion, cuuint64_t flags) {\n    // TraceCall(\"cuGetProcAddress\");\n    if (cudaVersion > 11030) { return (CUresult)1; }\n\n    if (!initialize() || g_interface.hgGetProcAddress_ptr == NULL) {\n        fprintf(stderr, \"Initialize HGGC Api Failed: hgGetProcAddress.\\n\");\n        exit(1);\n    }\n\n#define MAX_SYMBOL_SIZE 128\n    char new_symbol[MAX_SYMBOL_SIZE] = {0};\n\n    const char *old_patterns[] = {\"cuuint32_t\", \"cuuint64_t\", \"NvSci\", \"cuda\", \"CUDA\", \"cu\", \"CU\", \"nv\"};\n    const char *new_patterns[] = {\"uint32_t\", \"uint64_t\", \"HgSci\", \"hggc\", \"HGGC\", \"hg\", \"HG\", \"hg\"};\n    const int rule_count = 8;\n\n    size_t src_idx = 0;\n    size_t dst_idx = 0;\n\n    while (symbol[src_idx] != '\\0') {\n      bool matched = false;\n      for (int i = 0; i < rule_count; i++) {\n        size_t old_len = strlen(old_patterns[i]);\n        size_t new_len = strlen(new_patterns[i]);\n        if (strncmp(&symbol[src_idx], old_patterns[i], old_len) == 0) {\n          bool hit = false;\n          char c1 = old_patterns[i][0];\n          char c2 = old_patterns[i][old_len - 1];\n          if (src_idx == 0) {\n            char after_c2 = symbol[src_idx + old_len];\n            hit = (!!isupper(c2) != !!isupper(after_c2));\n          } else if (src_idx == (strlen(symbol) - old_len)) {\n            char before_c1 = symbol[src_idx - 1];\n            hit = (!!isupper(c1) != !!isupper(before_c1));\n          } else {\n            char before_c1 = symbol[src_idx - 1];\n            char after_c2 = symbol[src_idx + old_len];\n            bool opposite1 = (!!isupper(c1) != !!isupper(before_c1));\n            bool opposite2 = (!!isupper(c2) != !!isupper(after_c2));\n            hit = opposite1 && opposite2;\n          }\n          if ((dst_idx + new_len < MAX_SYMBOL_SIZE) && hit) {\n            memcpy(&new_symbol[dst_idx], new_patterns[i], new_len);\n            dst_idx += new_len;\n            src_idx += old_len;\n            matched = true;\n            break;\n          }\n        }\n      }\n      if (!matched) {\n        if (dst_idx + 1 < MAX_SYMBOL_SIZE) {\n          new_symbol[dst_idx++] = symbol[src_idx++];\n        } else {\n          break;\n        }\n      }\n    }\n\n    new_symbol[dst_idx] = '\\0';\n\n    bool needProfile = g_profileHandler.isCallbackEnabled != NULL &&\n        g_profileHandler.isCallbackEnabled(g_profileDomain, cuda_TRACE_CBID_cuGetProcAddress) != 0;\n    if (needProfile) {\n        g_profileHandler.profileCallbackBegin(g_profileDomain, cuda_TRACE_CBID_cuGetProcAddress);\n    }\n\n    auto __ret = g_interface.hgGetProcAddress_ptr((const char * )new_symbol, (void ** )pfn, (int)cudaVersion, (uint64_t)flags);\n\n    if (needProfile) {\n        g_profileHandler.profileCallbackEnd(g_profileDomain, cuda_TRACE_CBID_cuGetProcAddress);\n    }\n\n    return (CUresult)__ret;\n}\n\n"
