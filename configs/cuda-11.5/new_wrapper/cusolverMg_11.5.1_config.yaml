  loader_start: |
    static uint32_t g_profileDomain;

    static const char* g_profileFunctionList[] = {
        "cusolverMgCreate",
        "cusolverMgCreateDeviceGrid",
        "cusolverMgCreateMatrixDesc",
        "cusolverMgDestroy",
        "cusolverMgDestroyGrid",
        "cusolverMgDestroyMatrixDesc",
        "cusolverMgDeviceSelect",
        "cusolverMgGetrf",
