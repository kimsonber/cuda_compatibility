    custom_func_imp: "nvPTXCompileResult nvPTXCompilerGetVersion(unsigned int * major, unsigned int * minor) {\n // TraceCall(\"nvPTXCompilerGetVersion\");\n    if (major == nullptr || minor == nullptr) {\n      // NVPTXCOMPILE_ERROR_INTERNAL\n      return (nvPTXCompileResult)0x4;\n    }\n    *major = CUDA_VERSION / 1000;\n    *minor = (CUDA_VERSION - (*major * 1000)) / 10;\n    return NVPTXCOMPILE_SUCCESS;\n}\n\n"
global_custom_code:
  loader_start: |
    static uint32_t g_profileDomain;

    static const char* g_profileFunctionList[] = {
        "nvPTXCompilerCompile",
        "nvPTXCompilerCreate",
        "nvPTXCompilerDestroy",
        "nvPTXCompilerGetCompiledProgram",
        "nvPTXCompilerGetCompiledProgramSize",
        "nvPTXCompilerGetErrorLog",
        "nvPTXCompilerGetErrorLogSize",
        "nvPTXCompilerGetInfoLog",
        "nvPTXCompilerGetInfoLogSize",
        "nvPTXCompilerGetVersion",
    };

    enum nvptxcompilerProfileCallbackId {
        nvptxcompiler_TRACE_CBID_nvPTXCompilerCompile = 0,
        nvptxcompiler_TRACE_CBID_nvPTXCompilerCreate = 1,
        nvptxcompiler_TRACE_CBID_nvPTXCompilerDestroy = 2,
        nvptxcompiler_TRACE_CBID_nvPTXCompilerGetCompiledProgram = 3,
        nvptxcompiler_TRACE_CBID_nvPTXCompilerGetCompiledProgramSize = 4,
        nvptxcompiler_TRACE_CBID_nvPTXCompilerGetErrorLog = 5,
        nvptxcompiler_TRACE_CBID_nvPTXCompilerGetErrorLogSize = 6,
        nvptxcompiler_TRACE_CBID_nvPTXCompilerGetInfoLog = 7,
        nvptxcompiler_TRACE_CBID_nvPTXCompilerGetInfoLogSize = 8,
        nvptxcompiler_TRACE_CBID_nvPTXCompilerGetVersion = 9,
    };

    typedef uint32_t (*nvptxcompilerRegisterProfileDomain)(const char* domain_name, const char** function_list, uint32_t function_number);
    typedef uint8_t (*nvptxcompilerIsProfileCallbackEnabled)(uint32_t domain, uint32_t callback_id);
    typedef void (*nvptxcompilerProfileCallbackBegin)(uint32_t domain, uint32_t callback_id);
    typedef void (*nvptxcompilerProfileCallbackEnd)(uint32_t domain, uint32_t callback_id);

    struct nvptxcompilerProfileHandler {
        nvptxcompilerRegisterProfileDomain registerProfileDomain;
        nvptxcompilerIsProfileCallbackEnabled isCallbackEnabled;
        nvptxcompilerProfileCallbackBegin profileCallbackBegin;
        nvptxcompilerProfileCallbackEnd profileCallbackEnd;
    };

    static nvptxcompilerProfileHandler g_profileHandler;
    static bool gDirectReturn = false;
    static const char* gLibName = "nvptxcompiler";

    static void InitializeProfileHandler() {
        // get library patch
        const char* profile_tool_library = getenv("WRAPPER_INJECTION_PATH");
        if (profile_tool_library == NULL) {
            return;
        }

        // open profile library
        void* tool_handler = dlopen(profile_tool_library, RTLD_LAZY);
        if (!tool_handler) {
            printf("cannot open the file:%s  with error %s\n", profile_tool_library, dlerror());
            return;
        }

        // init profile handler
        g_profileHandler.registerProfileDomain = reinterpret_cast<nvptxcompilerRegisterProfileDomain>(dlsym(tool_handler, "wrapperRegisterProfileDomain"));
        g_profileHandler.isCallbackEnabled = reinterpret_cast<nvptxcompilerIsProfileCallbackEnabled>(dlsym(tool_handler, "wrapperIsProfileCallbackEnabled"));
        g_profileHandler.profileCallbackBegin = reinterpret_cast<nvptxcompilerProfileCallbackBegin>(dlsym(tool_handler, "wrapperProfileCallbackBegin"));
        g_profileHandler.profileCallbackEnd = reinterpret_cast<nvptxcompilerProfileCallbackEnd>(dlsym(tool_handler, "wrapperProfileCallbackEnd"));

        // register profile domain
        if (g_profileHandler.registerProfileDomain != NULL) {
            g_profileDomain = g_profileHandler.registerProfileDomain(gLibName, g_profileFunctionList, sizeof(g_profileFunctionList) / sizeof(g_profileFunctionList[0]));
            if (g_profileDomain == 0) {
                g_profileHandler.isCallbackEnabled = NULL;
            }
        }
    }

  post_dlopen_tgt_lib: |
    InitializeProfileHandler();

  pre_wrapper_call: |
    bool needProfile = g_profileHandler.isCallbackEnabled != NULL &&
            g_profileHandler.isCallbackEnabled(g_profileDomain, nvptxcompiler_TRACE_CBID_$WRAPPER_FUNC_NAME) != 0;
        if (needProfile) {
            g_profileHandler.profileCallbackBegin(g_profileDomain, nvptxcompiler_TRACE_CBID_$WRAPPER_FUNC_NAME);
        }

  post_wrapper_call: |
    if (needProfile) {
            g_profileHandler.profileCallbackEnd(g_profileDomain, nvptxcompiler_TRACE_CBID_$WRAPPER_FUNC_NAME);
        }

