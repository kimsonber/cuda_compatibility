      signature:
        return_type:
          name: char *
          is_pointer: true
          type_str: char * {}
        parameters:
          - name: id
            param_type:
              name: char
              is_pointer: true
              type_str: const char * {}
          - name: output_buffer
            param_type:
              name: char
              is_pointer: true
              type_str: char * {}
          - name: length
            param_type:
              name: int
              is_pointer: true
              type_str: int * {}
          - name: status
            param_type:
              name: int
              is_pointer: true
              type_str: int * {}
      has_body: false
      body_dependencies:
        []
      attributes:
        []
target_library:
  lib_name: ""
  dyn_lib_file_name: libNeedImpl.so
  lib_dirs:
    []
  include_files:
    - hgfilt.h
  include_dirs:
    - $output/hggc_wrapper
