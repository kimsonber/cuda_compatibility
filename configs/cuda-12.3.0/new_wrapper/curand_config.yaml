global_custom_code:
  loader_start: |
    static uint32_t g_profileDomain;

    static const char* g_profileFunctionList[] = {
        "curandCreateGenerator",
        "curandCreateGeneratorHost",
        "curandCreatePoissonDistribution",
        "curandDestroyDistribution",
        "curandDestroyGenerator",
        "curandGenerate",
        "curandGenerateBinomial",
        "curandGenerateBinomialMethod",
        "curandGenerateLogNormal",
        "curandGenerateLogNormalDouble",
        "curandGenerateLongLong",
        "curandGenerateNormal",
        "curandGenerateNormalDouble",
        "curandGeneratePoisson",
        "curandGeneratePoissonMethod",
        "curandGenerateSeeds",
        "curandGenerateUniform",
        "curandGenerateUniformDouble",
        "curandGetDirectionVectors32",
        "curandGetDirectionVectors64",
        "curandGetProperty",
        "curandGetScrambleConstants32",
        "curandGetScrambleConstants64",
        "curandGetVersion",
        "curandSetGeneratorOffset",
        "curandSetGeneratorOrdering",
        "curandSetPseudoRandomGeneratorSeed",
        "curandSetQuasiRandomGeneratorDimensions",
        "curandSetStream",
    };

    enum curandProfileCallbackId {
        curand_TRACE_CBID_curandCreateGenerator = 0,
        curand_TRACE_CBID_curandCreateGeneratorHost = 1,
        curand_TRACE_CBID_curandCreatePoissonDistribution = 2,
        curand_TRACE_CBID_curandDestroyDistribution = 3,
        curand_TRACE_CBID_curandDestroyGenerator = 4,
        curand_TRACE_CBID_curandGenerate = 5,
        curand_TRACE_CBID_curandGenerateBinomial = 6,
        curand_TRACE_CBID_curandGenerateBinomialMethod = 7,
        curand_TRACE_CBID_curandGenerateLogNormal = 8,
        curand_TRACE_CBID_curandGenerateLogNormalDouble = 9,
        curand_TRACE_CBID_curandGenerateLongLong = 10,
        curand_TRACE_CBID_curandGenerateNormal = 11,
        curand_TRACE_CBID_curandGenerateNormalDouble = 12,
        curand_TRACE_CBID_curandGeneratePoisson = 13,
        curand_TRACE_CBID_curandGeneratePoissonMethod = 14,
        curand_TRACE_CBID_curandGenerateSeeds = 15,
        curand_TRACE_CBID_curandGenerateUniform = 16,
        curand_TRACE_CBID_curandGenerateUniformDouble = 17,
        curand_TRACE_CBID_curandGetDirectionVectors32 = 18,
        curand_TRACE_CBID_curandGetDirectionVectors64 = 19,
        curand_TRACE_CBID_curandGetProperty = 20,
        curand_TRACE_CBID_curandGetScrambleConstants32 = 21,
        curand_TRACE_CBID_curandGetScrambleConstants64 = 22,
        curand_TRACE_CBID_curandGetVersion = 23,
        curand_TRACE_CBID_curandSetGeneratorOffset = 24,
        curand_TRACE_CBID_curandSetGeneratorOrdering = 25,
        curand_TRACE_CBID_curandSetPseudoRandomGeneratorSeed = 26,
        curand_TRACE_CBID_curandSetQuasiRandomGeneratorDimensions = 27,
        curand_TRACE_CBID_curandSetStream = 28,
    };

    typedef uint32_t (*curandRegisterProfileDomain)(const char* domain_name, const char** function_list, uint32_t function_number);
    typedef uint8_t (*curandIsProfileCallbackEnabled)(uint32_t domain, uint32_t callback_id);
    typedef void (*curandProfileCallbackBegin)(uint32_t domain, uint32_t callback_id);
    typedef void (*curandProfileCallbackEnd)(uint32_t domain, uint32_t callback_id);

    struct curandProfileHandler {
        curandRegisterProfileDomain registerProfileDomain;
        curandIsProfileCallbackEnabled isCallbackEnabled;
        curandProfileCallbackBegin profileCallbackBegin;
        curandProfileCallbackEnd profileCallbackEnd;
    };

    static curandProfileHandler g_profileHandler;
    static bool gDirectReturn = false;
    static const char* gLibName = "curand";

    static void InitializeProfileHandler() {
        // get library patch
        const char* profile_tool_library = getenv("WRAPPER_INJECTION_PATH");
        if (profile_tool_library == NULL) {
            return;
        }

        // open profile library
        void* tool_handler = dlopen(profile_tool_library, RTLD_LAZY);
        if (!tool_handler) {
            printf("cannot open the file:%s  with error %s\n", profile_tool_library, dlerror());
            return;
        }

        // init profile handler
        g_profileHandler.registerProfileDomain = reinterpret_cast<curandRegisterProfileDomain>(dlsym(tool_handler, "wrapperRegisterProfileDomain"));
        g_profileHandler.isCallbackEnabled = reinterpret_cast<curandIsProfileCallbackEnabled>(dlsym(tool_handler, "wrapperIsProfileCallbackEnabled"));
        g_profileHandler.profileCallbackBegin = reinterpret_cast<curandProfileCallbackBegin>(dlsym(tool_handler, "wrapperProfileCallbackBegin"));
        g_profileHandler.profileCallbackEnd = reinterpret_cast<curandProfileCallbackEnd>(dlsym(tool_handler, "wrapperProfileCallbackEnd"));

        // register profile domain
        if (g_profileHandler.registerProfileDomain != NULL) {
            g_profileDomain = g_profileHandler.registerProfileDomain(gLibName, g_profileFunctionList, sizeof(g_profileFunctionList) / sizeof(g_profileFunctionList[0]));
            if (g_profileDomain == 0) {
                g_profileHandler.isCallbackEnabled = NULL;
            }
        }
    }

  post_dlopen_tgt_lib: |
    InitializeProfileHandler();

  pre_wrapper_call: |
    bool needProfile = g_profileHandler.isCallbackEnabled != NULL &&
            g_profileHandler.isCallbackEnabled(g_profileDomain, curand_TRACE_CBID_$WRAPPER_FUNC_NAME) != 0;
        if (needProfile) {
            g_profileHandler.profileCallbackBegin(g_profileDomain, curand_TRACE_CBID_$WRAPPER_FUNC_NAME);
        }

  post_wrapper_call: |
    if (needProfile) {
            g_profileHandler.profileCallbackEnd(g_profileDomain, curand_TRACE_CBID_$WRAPPER_FUNC_NAME);
        }

