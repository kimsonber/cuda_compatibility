api_mappings:
  - source_function: nvFatbinAddCubin
    target_function: hgFatbinAddHgbin
    parameter_mapping:
      {}
  - source_function: nvFatbinAddLTOIR
    target_function: hgFatbinAddLTOIR
    parameter_mapping:
      {}
  - source_function: nvFatbinAddPTX
    target_function: hgFatbinAddTIX
    parameter_mapping:
      {}
  - source_function: nvFatbinCreate
    target_function: ""
    parameter_mapping:
      {}
    custom_func_imp: "nvFatbinResult nvFatbinCreate(nvFatbinHandle * handle_indirect, const char ** options, size_t optionsCount) {\n // TraceCall(\"nvFatbinCreate\");\n    // Ensure library is loaded\n    if (!initialize()) {\n        fprintf(stderr, \"Failed to load target library for function nvFatbinCreate\\n\");\n        exit(1);\n    }\n\n    if (options != NULL) {\n        for (uint32_t i = 0; i < optionsCount; ++i) {\n            if (strcmp(options[i], \"-cuda\") == 0 || strcmp(options[i], \"--cuda\") == 0) {\n                options[i] = \"--hggc\";\n            }\n        }\n    }\n\n    // Check if the function symbol was loaded successfully\n    CHECK_LOAD_SYMBOL(g_interface.hgFatbinCreate_ptr, \"hgFatbinCreate\");\n\n    bool needProfile = g_profileHandler.isCallbackEnabled != NULL &&\n        g_profileHandler.isCallbackEnabled(g_profileDomain, nvfatbin_TRACE_CBID_nvFatbinCreate) != 0;\n    if (needProfile) {\n        g_profileHandler.profileCallbackBegin(g_profileDomain, nvfatbin_TRACE_CBID_nvFatbinCreate);\n    }\n\n    // Call the target function with mapped parameters\n    auto __result = g_interface.hgFatbinCreate_ptr((hgFatbinHandle *)handle_indirect, options, optionsCount);\n\n    if (needProfile) {\n        g_profileHandler.profileCallbackEnd(g_profileDomain, nvfatbin_TRACE_CBID_nvFatbinCreate);\n    }\n\n    return ((nvFatbinResult)__result);\n}\n\n"
  - source_function: nvFatbinDestroy
    target_function: hgFatbinDestroy
    parameter_mapping:
      {}
  - source_function: nvFatbinGet
    target_function: hgFatbinGet
    parameter_mapping:
      {}
  - source_function: nvFatbinGetErrorString
    target_function: hgFatbinGetErrorString
    parameter_mapping:
      {}
  - source_function: nvFatbinSize
    target_function: hgFatbinSize
    parameter_mapping:
      {}
  - source_function: nvFatbinVersion
    target_function: ""
    parameter_mapping:
      {}
    custom_func_imp: "nvFatbinResult nvFatbinVersion(unsigned int * major, unsigned int * minor) {\n // TraceCall(\"nvFatbinVersion\");\n    if (major == nullptr || minor == nullptr) {\n      return NVFATBIN_ERROR_NULL_POINTER;\n    }\n    *major = CUDA_VERSION / 1000;\n    *minor = (CUDA_VERSION - (*major * 1000)) / 10;\n    return NVFATBIN_SUCCESS;\n}\n\n"
global_custom_code:
  loader_start: |
    static uint32_t g_profileDomain;

    static const char* g_profileFunctionList[] = {
        "nvFatbinAddCubin",
        "nvFatbinAddLTOIR",
        "nvFatbinAddPTX",
        "nvFatbinCreate",
        "nvFatbinDestroy",
        "nvFatbinGet",
        "nvFatbinGetErrorString",
        "nvFatbinSize",
        "nvFatbinVersion",
    };

    enum nvfatbinProfileCallbackId {
        nvfatbin_TRACE_CBID_nvFatbinAddCubin = 0,
        nvfatbin_TRACE_CBID_nvFatbinAddLTOIR = 1,
        nvfatbin_TRACE_CBID_nvFatbinAddPTX = 2,
        nvfatbin_TRACE_CBID_nvFatbinCreate = 3,
        nvfatbin_TRACE_CBID_nvFatbinDestroy = 4,
        nvfatbin_TRACE_CBID_nvFatbinGet = 5,
        nvfatbin_TRACE_CBID_nvFatbinGetErrorString = 6,
        nvfatbin_TRACE_CBID_nvFatbinSize = 7,
        nvfatbin_TRACE_CBID_nvFatbinVersion = 8,
    };

    typedef uint32_t (*nvfatbinRegisterProfileDomain)(const char* domain_name, const char** function_list, uint32_t function_number);
    typedef uint8_t (*nvfatbinIsProfileCallbackEnabled)(uint32_t domain, uint32_t callback_id);
    typedef void (*nvfatbinProfileCallbackBegin)(uint32_t domain, uint32_t callback_id);
    typedef void (*nvfatbinProfileCallbackEnd)(uint32_t domain, uint32_t callback_id);

    struct nvfatbinProfileHandler {
        nvfatbinRegisterProfileDomain registerProfileDomain;
        nvfatbinIsProfileCallbackEnabled isCallbackEnabled;
        nvfatbinProfileCallbackBegin profileCallbackBegin;
        nvfatbinProfileCallbackEnd profileCallbackEnd;
    };

    static nvfatbinProfileHandler g_profileHandler;
    static bool gDirectReturn = false;
    static const char* gLibName = "nvfatbin";

    static void InitializeProfileHandler() {
        // get library patch
        const char* profile_tool_library = getenv("WRAPPER_INJECTION_PATH");
        if (profile_tool_library == NULL) {
            return;
        }

        // open profile library
        void* tool_handler = dlopen(profile_tool_library, RTLD_LAZY);
        if (!tool_handler) {
            printf("cannot open the file:%s  with error %s\n", profile_tool_library, dlerror());
            return;
        }

        // init profile handler
        g_profileHandler.registerProfileDomain = reinterpret_cast<nvfatbinRegisterProfileDomain>(dlsym(tool_handler, "wrapperRegisterProfileDomain"));
        g_profileHandler.isCallbackEnabled = reinterpret_cast<nvfatbinIsProfileCallbackEnabled>(dlsym(tool_handler, "wrapperIsProfileCallbackEnabled"));
        g_profileHandler.profileCallbackBegin = reinterpret_cast<nvfatbinProfileCallbackBegin>(dlsym(tool_handler, "wrapperProfileCallbackBegin"));
        g_profileHandler.profileCallbackEnd = reinterpret_cast<nvfatbinProfileCallbackEnd>(dlsym(tool_handler, "wrapperProfileCallbackEnd"));

        // register profile domain
        if (g_profileHandler.registerProfileDomain != NULL) {
            g_profileDomain = g_profileHandler.registerProfileDomain(gLibName, g_profileFunctionList, sizeof(g_profileFunctionList) / sizeof(g_profileFunctionList[0]));
            if (g_profileDomain == 0) {
                g_profileHandler.isCallbackEnabled = NULL;
            }
        }
    }

  post_dlopen_tgt_lib: |
    InitializeProfileHandler();

  pre_wrapper_call: |
    bool needProfile = g_profileHandler.isCallbackEnabled != NULL &&
            g_profileHandler.isCallbackEnabled(g_profileDomain, nvfatbin_TRACE_CBID_$WRAPPER_FUNC_NAME) != 0;
        if (needProfile) {
            g_profileHandler.profileCallbackBegin(g_profileDomain, nvfatbin_TRACE_CBID_$WRAPPER_FUNC_NAME);
        }

  post_wrapper_call: |
    if (needProfile) {
            g_profileHandler.profileCallbackEnd(g_profileDomain, nvfatbin_TRACE_CBID_$WRAPPER_FUNC_NAME);
        }

