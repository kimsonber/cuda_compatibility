global_custom_code:
  loader_start: |
    static uint32_t g_profileDomain;

    static const char* g_profileFunctionList[] = {
        "nvvmAddModuleToProgram",
        "nvvmCompileProgram",
        "nvvmCreateProgram",
        "nvvmDestroyProgram",
        "nvvmGetCompiledResult",
        "nvvmGetCompiledResultSize",
        "nvvmGetErrorString",
        "nvvmGetProgramLog",
        "nvvmGetProgramLogSize",
        "nvvmIRVersion",
        "nvvmLazyAddModuleToProgram",
        "nvvmVerifyProgram",
        "nvvmVersion",
    };

    enum nvvmProfileCallbackId {
        nvvm_TRACE_CBID_nvvmAddModuleToProgram = 0,
        nvvm_TRACE_CBID_nvvmCompileProgram = 1,
        nvvm_TRACE_CBID_nvvmCreateProgram = 2,
        nvvm_TRACE_CBID_nvvmDestroyProgram = 3,
        nvvm_TRACE_CBID_nvvmGetCompiledResult = 4,
        nvvm_TRACE_CBID_nvvmGetCompiledResultSize = 5,
        nvvm_TRACE_CBID_nvvmGetErrorString = 6,
        nvvm_TRACE_CBID_nvvmGetProgramLog = 7,
        nvvm_TRACE_CBID_nvvmGetProgramLogSize = 8,
        nvvm_TRACE_CBID_nvvmIRVersion = 9,
        nvvm_TRACE_CBID_nvvmLazyAddModuleToProgram = 10,
        nvvm_TRACE_CBID_nvvmVerifyProgram = 11,
        nvvm_TRACE_CBID_nvvmVersion = 12,
    };

    typedef uint32_t (*nvvmRegisterProfileDomain)(const char* domain_name, const char** function_list, uint32_t function_number);
    typedef uint8_t (*nvvmIsProfileCallbackEnabled)(uint32_t domain, uint32_t callback_id);
    typedef void (*nvvmProfileCallbackBegin)(uint32_t domain, uint32_t callback_id);
    typedef void (*nvvmProfileCallbackEnd)(uint32_t domain, uint32_t callback_id);

    struct nvvmProfileHandler {
        nvvmRegisterProfileDomain registerProfileDomain;
        nvvmIsProfileCallbackEnabled isCallbackEnabled;
        nvvmProfileCallbackBegin profileCallbackBegin;
        nvvmProfileCallbackEnd profileCallbackEnd;
    };

    static nvvmProfileHandler g_profileHandler;
    static bool gDirectReturn = false;
    static const char* gLibName = "nvvm";

    static void InitializeProfileHandler() {
        // get library patch
        const char* profile_tool_library = getenv("WRAPPER_INJECTION_PATH");
        if (profile_tool_library == NULL) {
            return;
        }

        // open profile library
        void* tool_handler = dlopen(profile_tool_library, RTLD_LAZY);
        if (!tool_handler) {
            printf("cannot open the file:%s  with error %s\n", profile_tool_library, dlerror());
            return;
        }

        // init profile handler
        g_profileHandler.registerProfileDomain = reinterpret_cast<nvvmRegisterProfileDomain>(dlsym(tool_handler, "wrapperRegisterProfileDomain"));
        g_profileHandler.isCallbackEnabled = reinterpret_cast<nvvmIsProfileCallbackEnabled>(dlsym(tool_handler, "wrapperIsProfileCallbackEnabled"));
        g_profileHandler.profileCallbackBegin = reinterpret_cast<nvvmProfileCallbackBegin>(dlsym(tool_handler, "wrapperProfileCallbackBegin"));
        g_profileHandler.profileCallbackEnd = reinterpret_cast<nvvmProfileCallbackEnd>(dlsym(tool_handler, "wrapperProfileCallbackEnd"));

        // register profile domain
        if (g_profileHandler.registerProfileDomain != NULL) {
            g_profileDomain = g_profileHandler.registerProfileDomain(gLibName, g_profileFunctionList, sizeof(g_profileFunctionList) / sizeof(g_profileFunctionList[0]));
            if (g_profileDomain == 0) {
                g_profileHandler.isCallbackEnabled = NULL;
            }
        }
    }

  post_dlopen_tgt_lib: |
    InitializeProfileHandler();

  pre_wrapper_call: |
    bool needProfile = g_profileHandler.isCallbackEnabled != NULL &&
            g_profileHandler.isCallbackEnabled(g_profileDomain, nvvm_TRACE_CBID_$WRAPPER_FUNC_NAME) != 0;
        if (needProfile) {
            g_profileHandler.profileCallbackBegin(g_profileDomain, nvvm_TRACE_CBID_$WRAPPER_FUNC_NAME);
        }

  post_wrapper_call: |
    if (needProfile) {
            g_profileHandler.profileCallbackEnd(g_profileDomain, nvvm_TRACE_CBID_$WRAPPER_FUNC_NAME);
        }

