      - USE_CUDA_RUNTIME=1
      - __BF16_DEFINED__
      - __FP16_DEFINED__
      - __FP8_DEFINED__
    cxx_flags:
      []
    linker_flags:
      - -soname,libnppitc.so.13
      - "--version-script=<(echo \"libnppitc.so.13 {global:  *;local:  *;};\")"
      - --default-symver
      - --no-as-needed
