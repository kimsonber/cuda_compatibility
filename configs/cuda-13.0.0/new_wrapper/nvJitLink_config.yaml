global_custom_code:
  loader_start: |
    static uint32_t g_profileDomain;

    static const char* g_profileFunctionList[] = {
        "__nvJitLinkAddData_13_0",
        "__nvJitLinkAddFile_13_0",
        "__nvJitLinkComplete_13_0",
        "__nvJitLinkCreate_13_0",
        "__nvJitLinkDestroy_13_0",
        "__nvJitLinkGetErrorLogSize_13_0",
        "__nvJitLinkGetErrorLog_13_0",
        "__nvJitLinkGetInfoLogSize_13_0",
        "__nvJitLinkGetInfoLog_13_0",
        "__nvJitLinkGetLinkedCubinSize_13_0",
        "__nvJitLinkGetLinkedCubin_13_0",
        "__nvJitLinkGetLinkedPtxSize_13_0",
        "__nvJitLinkGetLinkedPtx_13_0",
        "nvJitLinkVersion",
    };

    enum nvJitLinkProfileCallbackId {
        nvJitLink_TRACE_CBID___nvJitLinkAddData_13_0 = 0,
        nvJitLink_TRACE_CBID___nvJitLinkAddFile_13_0 = 1,
        nvJitLink_TRACE_CBID___nvJitLinkComplete_13_0 = 2,
        nvJitLink_TRACE_CBID___nvJitLinkCreate_13_0 = 3,
        nvJitLink_TRACE_CBID___nvJitLinkDestroy_13_0 = 4,
        nvJitLink_TRACE_CBID___nvJitLinkGetErrorLogSize_13_0 = 5,
        nvJitLink_TRACE_CBID___nvJitLinkGetErrorLog_13_0 = 6,
        nvJitLink_TRACE_CBID___nvJitLinkGetInfoLogSize_13_0 = 7,
        nvJitLink_TRACE_CBID___nvJitLinkGetInfoLog_13_0 = 8,
        nvJitLink_TRACE_CBID___nvJitLinkGetLinkedCubinSize_13_0 = 9,
        nvJitLink_TRACE_CBID___nvJitLinkGetLinkedCubin_13_0 = 10,
        nvJitLink_TRACE_CBID___nvJitLinkGetLinkedPtxSize_13_0 = 11,
        nvJitLink_TRACE_CBID___nvJitLinkGetLinkedPtx_13_0 = 12,
        nvJitLink_TRACE_CBID_nvJitLinkVersion = 13,
    };

    typedef uint32_t (*nvJitLinkRegisterProfileDomain)(const char* domain_name, const char** function_list, uint32_t function_number);
    typedef uint8_t (*nvJitLinkIsProfileCallbackEnabled)(uint32_t domain, uint32_t callback_id);
    typedef void (*nvJitLinkProfileCallbackBegin)(uint32_t domain, uint32_t callback_id);
    typedef void (*nvJitLinkProfileCallbackEnd)(uint32_t domain, uint32_t callback_id);

    struct nvJitLinkProfileHandler {
        nvJitLinkRegisterProfileDomain registerProfileDomain;
        nvJitLinkIsProfileCallbackEnabled isCallbackEnabled;
        nvJitLinkProfileCallbackBegin profileCallbackBegin;
        nvJitLinkProfileCallbackEnd profileCallbackEnd;
    };

    static nvJitLinkProfileHandler g_profileHandler;
    static bool gDirectReturn = false;
    static const char* gLibName = "nvJitLink";

    static void InitializeProfileHandler() {
        // get library patch
        const char* profile_tool_library = getenv("WRAPPER_INJECTION_PATH");
        if (profile_tool_library == NULL) {
            return;
        }

        // open profile library
        void* tool_handler = dlopen(profile_tool_library, RTLD_LAZY);
        if (!tool_handler) {
            printf("cannot open the file:%s  with error %s\n", profile_tool_library, dlerror());
            return;
        }

        // init profile handler
        g_profileHandler.registerProfileDomain = reinterpret_cast<nvJitLinkRegisterProfileDomain>(dlsym(tool_handler, "wrapperRegisterProfileDomain"));
        g_profileHandler.isCallbackEnabled = reinterpret_cast<nvJitLinkIsProfileCallbackEnabled>(dlsym(tool_handler, "wrapperIsProfileCallbackEnabled"));
        g_profileHandler.profileCallbackBegin = reinterpret_cast<nvJitLinkProfileCallbackBegin>(dlsym(tool_handler, "wrapperProfileCallbackBegin"));
        g_profileHandler.profileCallbackEnd = reinterpret_cast<nvJitLinkProfileCallbackEnd>(dlsym(tool_handler, "wrapperProfileCallbackEnd"));

        // register profile domain
        if (g_profileHandler.registerProfileDomain != NULL) {
            g_profileDomain = g_profileHandler.registerProfileDomain(gLibName, g_profileFunctionList, sizeof(g_profileFunctionList) / sizeof(g_profileFunctionList[0]));
            if (g_profileDomain == 0) {
                g_profileHandler.isCallbackEnabled = NULL;
            }
        }
    }

  post_dlopen_tgt_lib: |
    InitializeProfileHandler();

  pre_wrapper_call: |
    bool needProfile = g_profileHandler.isCallbackEnabled != NULL &&
            g_profileHandler.isCallbackEnabled(g_profileDomain, nvJitLink_TRACE_CBID_$WRAPPER_FUNC_NAME) != 0;
        if (needProfile) {
            g_profileHandler.profileCallbackBegin(g_profileDomain, nvJitLink_TRACE_CBID_$WRAPPER_FUNC_NAME);
        }

  post_wrapper_call: |
    if (needProfile) {
            g_profileHandler.profileCallbackEnd(g_profileDomain, nvJitLink_TRACE_CBID_$WRAPPER_FUNC_NAME);
        }

