  dyn_lib_file_name: libnvidia-ml.so
  dyn_lib_install_name: libnvidia-ml.so
  sta_lib_file_name: libnvidia-ml.a
  lib_dirs:
    []
  include_files:
    - cuda.h
    - ../../include/texture_types.h
    - nvml.h
  include_dirs:
    - $lib1/extras/CUPTI/include
    - $lib1/extras/Debugger/include
    - $lib1/targets/x86_64-linux/include
    - $lib1/nvvm/include
    - $lib1/compute-sanitizer/include
    - $config/PrivateHeader/GL
    - $config/PrivateHeader
    - $config/PrivateHeader/KHR
    - $config/PrivateHeader/EGL
    - $cu_ad
  extra_src_files:
    []
  compilation_options:
    macros:
      - NVML_NO_UNVERSIONED_FUNC_DEFS
      - USE_CUDA_RUNTIME=1
      - __BF16_DEFINED__
      - __FP16_DEFINED__
      - __FP8_DEFINED__
    cxx_flags:
      []
    linker_flags:
      - -soname,libnvidia-ml.so.1
      - --no-as-needed -lpthread
