global_custom_code:
  loader_start: |
    static uint32_t g_profileDomain;

    static const char* g_profileFunctionList[] = {
        "sanitizerAddPatches",
        "sanitizerAddPatchesFromFile",
        "sanitizerAlloc",
        "sanitizerAllocHost",
        "sanitizerEnableAllDomains",
        "sanitizerEnableCallback",
        "sanitizerEnableDomain",
        "sanitizerFree",
        "sanitizerFreeHost",
        "sanitizerGetCallbackPcAndSize",
