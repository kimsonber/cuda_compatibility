        "sanitizerGetFunctionLoadedStatus",
        "sanitizerGetFunctionPcAndSize",
        "sanitizerGetResultString",
        "sanitizerGetStream",
        "sanitizerGetStreamHandle",
        "sanitizerMemcpyDeviceToHost",
        "sanitizerMemcpyHostToDeviceAsync",
        "sanitizerMemset",
        "sanitizerPatchInstructions",
        "sanitizerPatchModule",
        "sanitizerSetCallbackData",
        "sanitizerSetDeviceGraphData",
        "sanitizerSetLaunchCallbackData",
        "sanitizerStreamSynchronize",
        "sanitizerSubscribe",
        "sanitizerUnpatchModule",
        "sanitizerUnsubscribe",
    };

    enum sanitizer_publicProfileCallbackId {
        sanitizer_public_TRACE_CBID_sanitizerAddPatches = 0,
        sanitizer_public_TRACE_CBID_sanitizerAddPatchesFromFile = 1,
        sanitizer_public_TRACE_CBID_sanitizerAlloc = 2,
        sanitizer_public_TRACE_CBID_sanitizerAllocHost = 3,
        sanitizer_public_TRACE_CBID_sanitizerEnableAllDomains = 4,
        sanitizer_public_TRACE_CBID_sanitizerEnableCallback = 5,
        sanitizer_public_TRACE_CBID_sanitizerEnableDomain = 6,
        sanitizer_public_TRACE_CBID_sanitizerFree = 7,
        sanitizer_public_TRACE_CBID_sanitizerFreeHost = 8,
        sanitizer_public_TRACE_CBID_sanitizerGetCallbackPcAndSize = 9,
        sanitizer_public_TRACE_CBID_sanitizerGetCallbackState = 10,
        sanitizer_public_TRACE_CBID_sanitizerGetCudaBarrierCount = 11,
        sanitizer_public_TRACE_CBID_sanitizerGetFunctionLoadedStatus = 12,
        sanitizer_public_TRACE_CBID_sanitizerGetFunctionPcAndSize = 13,
        sanitizer_public_TRACE_CBID_sanitizerGetResultString = 14,
        sanitizer_public_TRACE_CBID_sanitizerGetStream = 15,
        sanitizer_public_TRACE_CBID_sanitizerGetStreamHandle = 16,
        sanitizer_public_TRACE_CBID_sanitizerMemcpyDeviceToHost = 17,
        sanitizer_public_TRACE_CBID_sanitizerMemcpyHostToDeviceAsync = 18,
        sanitizer_public_TRACE_CBID_sanitizerMemset = 19,
        sanitizer_public_TRACE_CBID_sanitizerPatchInstructions = 20,
        sanitizer_public_TRACE_CBID_sanitizerPatchModule = 21,
        sanitizer_public_TRACE_CBID_sanitizerSetCallbackData = 22,
        sanitizer_public_TRACE_CBID_sanitizerSetDeviceGraphData = 23,
        sanitizer_public_TRACE_CBID_sanitizerSetLaunchCallbackData = 24,
        sanitizer_public_TRACE_CBID_sanitizerStreamSynchronize = 25,
        sanitizer_public_TRACE_CBID_sanitizerSubscribe = 26,
        sanitizer_public_TRACE_CBID_sanitizerUnpatchModule = 27,
        sanitizer_public_TRACE_CBID_sanitizerUnsubscribe = 28,
    };

    typedef uint32_t (*sanitizer_publicRegisterProfileDomain)(const char* domain_name, const char** function_list, uint32_t function_number);
    typedef uint8_t (*sanitizer_publicIsProfileCallbackEnabled)(uint32_t domain, uint32_t callback_id);
    typedef void (*sanitizer_publicProfileCallbackBegin)(uint32_t domain, uint32_t callback_id);
    typedef void (*sanitizer_publicProfileCallbackEnd)(uint32_t domain, uint32_t callback_id);

    struct sanitizer_publicProfileHandler {
        sanitizer_publicRegisterProfileDomain registerProfileDomain;
        sanitizer_publicIsProfileCallbackEnabled isCallbackEnabled;
        sanitizer_publicProfileCallbackBegin profileCallbackBegin;
        sanitizer_publicProfileCallbackEnd profileCallbackEnd;
    };

    static sanitizer_publicProfileHandler g_profileHandler;
    static bool gDirectReturn = false;
    static const char* gLibName = "sanitizer-public";

    static void InitializeProfileHandler() {
        // get library patch
        const char* profile_tool_library = getenv("WRAPPER_INJECTION_PATH");
        if (profile_tool_library == NULL) {
            return;
        }

        // open profile library
        void* tool_handler = dlopen(profile_tool_library, RTLD_LAZY);
        if (!tool_handler) {
            printf("cannot open the file:%s  with error %s\n", profile_tool_library, dlerror());
            return;
        }

        // init profile handler
        g_profileHandler.registerProfileDomain = reinterpret_cast<sanitizer_publicRegisterProfileDomain>(dlsym(tool_handler, "wrapperRegisterProfileDomain"));
        g_profileHandler.isCallbackEnabled = reinterpret_cast<sanitizer_publicIsProfileCallbackEnabled>(dlsym(tool_handler, "wrapperIsProfileCallbackEnabled"));
        g_profileHandler.profileCallbackBegin = reinterpret_cast<sanitizer_publicProfileCallbackBegin>(dlsym(tool_handler, "wrapperProfileCallbackBegin"));
        g_profileHandler.profileCallbackEnd = reinterpret_cast<sanitizer_publicProfileCallbackEnd>(dlsym(tool_handler, "wrapperProfileCallbackEnd"));

        // register profile domain
        if (g_profileHandler.registerProfileDomain != NULL) {
            g_profileDomain = g_profileHandler.registerProfileDomain(gLibName, g_profileFunctionList, sizeof(g_profileFunctionList) / sizeof(g_profileFunctionList[0]));
            if (g_profileDomain == 0) {
                g_profileHandler.isCallbackEnabled = NULL;
            }
        }
    }

  post_dlopen_tgt_lib: |
    InitializeProfileHandler();

  pre_wrapper_call: |
    bool needProfile = g_profileHandler.isCallbackEnabled != NULL &&
            g_profileHandler.isCallbackEnabled(g_profileDomain, sanitizer_public_TRACE_CBID_$WRAPPER_FUNC_NAME) != 0;
        if (needProfile) {
            g_profileHandler.profileCallbackBegin(g_profileDomain, sanitizer_public_TRACE_CBID_$WRAPPER_FUNC_NAME);
        }

  post_wrapper_call: |
    if (needProfile) {
            g_profileHandler.profileCallbackEnd(g_profileDomain, sanitizer_public_TRACE_CBID_$WRAPPER_FUNC_NAME);
        }

