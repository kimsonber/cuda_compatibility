global_custom_code:
  loader_start: |
    static uint32_t g_profileDomain;

    static const char* g_profileFunctionList[] = {
        "nvFatbinAddCubin",
        "nvFatbinAddIndex",
        "nvFatbinAddLTOIR",
        "nvFatbinAddPTX",
        "nvFatbinAddReloc",
        "nvFatbinAddTileIR",
        "nvFatbinCreate",
        "nvFatbinDestroy",
        "nvFatbinGet",
        "nvFatbinGetErrorString",
        "nvFatbinSize",
        "nvFatbinVersion",
    };

    enum nvfatbinProfileCallbackId {
        nvfatbin_TRACE_CBID_nvFatbinAddCubin = 0,
        nvfatbin_TRACE_CBID_nvFatbinAddIndex = 1,
        nvfatbin_TRACE_CBID_nvFatbinAddLTOIR = 2,
        nvfatbin_TRACE_CBID_nvFatbinAddPTX = 3,
        nvfatbin_TRACE_CBID_nvFatbinAddReloc = 4,
        nvfatbin_TRACE_CBID_nvFatbinAddTileIR = 5,
        nvfatbin_TRACE_CBID_nvFatbinCreate = 6,
        nvfatbin_TRACE_CBID_nvFatbinDestroy = 7,
        nvfatbin_TRACE_CBID_nvFatbinGet = 8,
        nvfatbin_TRACE_CBID_nvFatbinGetErrorString = 9,
        nvfatbin_TRACE_CBID_nvFatbinSize = 10,
        nvfatbin_TRACE_CBID_nvFatbinVersion = 11,
    };

    typedef uint32_t (*nvfatbinRegisterProfileDomain)(const char* domain_name, const char** function_list, uint32_t function_number);
    typedef uint8_t (*nvfatbinIsProfileCallbackEnabled)(uint32_t domain, uint32_t callback_id);
    typedef void (*nvfatbinProfileCallbackBegin)(uint32_t domain, uint32_t callback_id);
    typedef void (*nvfatbinProfileCallbackEnd)(uint32_t domain, uint32_t callback_id);

    struct nvfatbinProfileHandler {
        nvfatbinRegisterProfileDomain registerProfileDomain;
        nvfatbinIsProfileCallbackEnabled isCallbackEnabled;
        nvfatbinProfileCallbackBegin profileCallbackBegin;
        nvfatbinProfileCallbackEnd profileCallbackEnd;
    };

    static nvfatbinProfileHandler g_profileHandler;
    static bool gDirectReturn = false;
    static const char* gLibName = "nvfatbin";

    static void InitializeProfileHandler() {
        // get library patch
        const char* profile_tool_library = getenv("WRAPPER_INJECTION_PATH");
        if (profile_tool_library == NULL) {
            return;
        }

        // open profile library
        void* tool_handler = dlopen(profile_tool_library, RTLD_LAZY);
        if (!tool_handler) {
            printf("cannot open the file:%s  with error %s\n", profile_tool_library, dlerror());
            return;
        }

        // init profile handler
        g_profileHandler.registerProfileDomain = reinterpret_cast<nvfatbinRegisterProfileDomain>(dlsym(tool_handler, "wrapperRegisterProfileDomain"));
        g_profileHandler.isCallbackEnabled = reinterpret_cast<nvfatbinIsProfileCallbackEnabled>(dlsym(tool_handler, "wrapperIsProfileCallbackEnabled"));
        g_profileHandler.profileCallbackBegin = reinterpret_cast<nvfatbinProfileCallbackBegin>(dlsym(tool_handler, "wrapperProfileCallbackBegin"));
        g_profileHandler.profileCallbackEnd = reinterpret_cast<nvfatbinProfileCallbackEnd>(dlsym(tool_handler, "wrapperProfileCallbackEnd"));

        // register profile domain
        if (g_profileHandler.registerProfileDomain != NULL) {
            g_profileDomain = g_profileHandler.registerProfileDomain(gLibName, g_profileFunctionList, sizeof(g_profileFunctionList) / sizeof(g_profileFunctionList[0]));
            if (g_profileDomain == 0) {
                g_profileHandler.isCallbackEnabled = NULL;
            }
        }
    }

  post_dlopen_tgt_lib: |
    InitializeProfileHandler();

