      {}
    custom_func_imp: "nvPTXCompileResult nvPTXCompilerGetNumSupportedArchs(int * numArchs) {\nconst unsigned CUDA_131_ARCH_NUM = 6; // TraceCall(\"nvPTXCompilerGetNumSupportedArchs\");\n    if (numArchs == nullptr)\n      return (nvPTXCompileResult)2;\n    switch (CUDA_VERSION) {\n      break;\n    case 13010:\n      *numArchs = CUDA_131_ARCH_NUM;\n      break;\n    default:\n      return (nvPTXCompileResult)4;\n    }\n    return NVPTXCOMPILE_SUCCESS;\n}\n\n"
  - source_function: nvPTXCompilerGetNumSupportedVersions
    target_function: ""
    parameter_mapping:
      {}
    custom_func_imp: "nvPTXCompileResult nvPTXCompilerGetNumSupportedVersions(int * numVersions) {\n                                                                            const unsigned CUDA_130_VERSION_NUM = 44;\n                                    const unsigned CUDA_131_VERSION_NUM = 45;\n                                     // TraceCall(\"nvPTXCompilerGetNumSupportedVersions\");\n    if (numVersions == nullptr)\n      return (nvPTXCompileResult)2;\n    switch (CUDA_VERSION) {\n    case 13000:\n      *numVersions = CUDA_130_VERSION_NUM;\n      break;\n    case 13010:\n      *numVersions = CUDA_131_VERSION_NUM;\n      break;\n    default:\n      return (nvPTXCompileResult)4;\n    }\n    return NVPTXCOMPILE_SUCCESS;\n}\n\n"
  - source_function: nvPTXCompilerGetSupportedArchs
    target_function: ""
    parameter_mapping:
      {}
    custom_func_imp: "nvPTXCompileResult nvPTXCompilerGetSupportedArchs(int * supportedArchs) {\nconst unsigned CUDA_131_ARCH_NUM = 6;int cuda131Archs[CUDA_131_ARCH_NUM] = {75, 80, 86, 87, 88, 89}; // TraceCall(\"nvPTXCompilerGetSupportedArchs\");\n    if (supportedArchs == nullptr)\n      return (nvPTXCompileResult)2;\n    unsigned archNum;\n    int *arch;\n    switch (CUDA_VERSION) {\n    case 13010:\n      archNum = CUDA_131_ARCH_NUM;\n      arch = cuda131Archs;\n      break;\n    default:\n      return (nvPTXCompileResult)4;\n    }\n    for (unsigned I = 0; I < archNum; ++I)\n      supportedArchs[I] = arch[I];\n    return NVPTXCOMPILE_SUCCESS;\n}\n\n"
  - source_function: nvPTXCompilerGetSupportedVersions
    target_function: ""
    parameter_mapping:
      {}
    custom_func_imp: "nvPTXCompileResult nvPTXCompilerGetSupportedVersions(int (*versions)[2]) {\n                                                                            const unsigned CUDA_130_VERSION_NUM = 44;\n                                    const unsigned CUDA_131_VERSION_NUM = 45;\n                                                                                                                int cuda130Versions[CUDA_130_VERSION_NUM] = {\n                                    10, 11, 12, 13, 14, 15, 20, 21, 22, 23, 30, 31, 32, 40, 41,\n                  42, 43, 50, 51, 60, 61, 62, 63, 64, 65, 70, 71, 72, 73, 74,\n                  75, 76, 77, 78, 80, 81, 82, 83, 84, 85, 86, 87, 88, 90};\n                 int cuda131Versions[CUDA_131_VERSION_NUM] = {\n                                    10, 11, 12, 13, 14, 15, 20, 21, 22, 23, 30, 31, 32, 40, 41,\n                  42, 43, 50, 51, 60, 61, 62, 63, 64, 65, 70, 71, 72, 73, 74,\n                  75, 76, 77, 78, 80, 81, 82, 83, 84, 85, 86, 87, 88, 90, 91};\n              // TraceCall(\"nvPTXCompilerGetSupportedVersions\");\n    if (versions == nullptr)\n      return (nvPTXCompileResult)2;\n    unsigned versionNum;\n    int *version;\n    switch (CUDA_VERSION) {\n    case 13000:\n      versionNum = CUDA_130_VERSION_NUM;\n      version = cuda130Versions;\n      break;\n    case 13010:\n      versionNum = CUDA_131_VERSION_NUM;\n      version = cuda131Versions;\n      break;\n    default:\n      return (nvPTXCompileResult)4;\n    }\n    for (unsigned I = 0; I < versionNum; ++I) {\n      versions[I][0] = version[I] / 10;\n      versions[I][1] = version[I] % 10;\n    }\n    return NVPTXCOMPILE_SUCCESS;\n}\n\n"
  - source_function: nvPTXCompilerGetVersion
    target_function: ""
    parameter_mapping:
      {}
    custom_func_imp: "nvPTXCompileResult nvPTXCompilerGetVersion(unsigned int * major, unsigned int * minor) {\n // TraceCall(\"nvPTXCompilerGetVersion\");\n    if (major == nullptr || minor == nullptr) {\n      // NVPTXCOMPILE_ERROR_INTERNAL\n      return (nvPTXCompileResult)0x4;\n    }\n    *major = CUDA_VERSION / 1000;\n    *minor = (CUDA_VERSION - (*major * 1000)) / 10;\n    return NVPTXCOMPILE_SUCCESS;\n}\n\n"
  - source_function: nvPTXCompilerSetFlowCallback
    target_function: hgTIXCompilerSetFlowCallback
    parameter_mapping:
      {}
global_custom_code:
  loader_start: |
    static uint32_t g_profileDomain;

    static const char* g_profileFunctionList[] = {
        "nvPTXCompilerCompile",
        "nvPTXCompilerCreate",
        "nvPTXCompilerDestroy",
        "nvPTXCompilerGetCompiledProgram",
        "nvPTXCompilerGetCompiledProgramSize",
        "nvPTXCompilerGetErrorLog",
        "nvPTXCompilerGetErrorLogSize",
        "nvPTXCompilerGetInfoLog",
        "nvPTXCompilerGetInfoLogSize",
        "nvPTXCompilerGetNumSupportedArchs",
        "nvPTXCompilerGetNumSupportedVersions",
        "nvPTXCompilerGetSupportedArchs",
        "nvPTXCompilerGetSupportedVersions",
        "nvPTXCompilerGetVersion",
        "nvPTXCompilerSetFlowCallback",
    };

    enum nvptxcompilerProfileCallbackId {
        nvptxcompiler_TRACE_CBID_nvPTXCompilerCompile = 0,
        nvptxcompiler_TRACE_CBID_nvPTXCompilerCreate = 1,
        nvptxcompiler_TRACE_CBID_nvPTXCompilerDestroy = 2,
        nvptxcompiler_TRACE_CBID_nvPTXCompilerGetCompiledProgram = 3,
        nvptxcompiler_TRACE_CBID_nvPTXCompilerGetCompiledProgramSize = 4,
        nvptxcompiler_TRACE_CBID_nvPTXCompilerGetErrorLog = 5,
        nvptxcompiler_TRACE_CBID_nvPTXCompilerGetErrorLogSize = 6,
        nvptxcompiler_TRACE_CBID_nvPTXCompilerGetInfoLog = 7,
        nvptxcompiler_TRACE_CBID_nvPTXCompilerGetInfoLogSize = 8,
        nvptxcompiler_TRACE_CBID_nvPTXCompilerGetNumSupportedArchs = 9,
        nvptxcompiler_TRACE_CBID_nvPTXCompilerGetNumSupportedVersions = 10,
        nvptxcompiler_TRACE_CBID_nvPTXCompilerGetSupportedArchs = 11,
        nvptxcompiler_TRACE_CBID_nvPTXCompilerGetSupportedVersions = 12,
        nvptxcompiler_TRACE_CBID_nvPTXCompilerGetVersion = 13,
        nvptxcompiler_TRACE_CBID_nvPTXCompilerSetFlowCallback = 14,
    };

    typedef uint32_t (*nvptxcompilerRegisterProfileDomain)(const char* domain_name, const char** function_list, uint32_t function_number);
    typedef uint8_t (*nvptxcompilerIsProfileCallbackEnabled)(uint32_t domain, uint32_t callback_id);
    typedef void (*nvptxcompilerProfileCallbackBegin)(uint32_t domain, uint32_t callback_id);
    typedef void (*nvptxcompilerProfileCallbackEnd)(uint32_t domain, uint32_t callback_id);

    struct nvptxcompilerProfileHandler {
        nvptxcompilerRegisterProfileDomain registerProfileDomain;
        nvptxcompilerIsProfileCallbackEnabled isCallbackEnabled;
        nvptxcompilerProfileCallbackBegin profileCallbackBegin;
        nvptxcompilerProfileCallbackEnd profileCallbackEnd;
    };

    static nvptxcompilerProfileHandler g_profileHandler;
    static bool gDirectReturn = false;
    static const char* gLibName = "nvptxcompiler";

    static void InitializeProfileHandler() {
        // get library patch
        const char* profile_tool_library = getenv("WRAPPER_INJECTION_PATH");
        if (profile_tool_library == NULL) {
            return;
        }

        // open profile library
        void* tool_handler = dlopen(profile_tool_library, RTLD_LAZY);
        if (!tool_handler) {
            printf("cannot open the file:%s  with error %s\n", profile_tool_library, dlerror());
            return;
        }

        // init profile handler
        g_profileHandler.registerProfileDomain = reinterpret_cast<nvptxcompilerRegisterProfileDomain>(dlsym(tool_handler, "wrapperRegisterProfileDomain"));
        g_profileHandler.isCallbackEnabled = reinterpret_cast<nvptxcompilerIsProfileCallbackEnabled>(dlsym(tool_handler, "wrapperIsProfileCallbackEnabled"));
        g_profileHandler.profileCallbackBegin = reinterpret_cast<nvptxcompilerProfileCallbackBegin>(dlsym(tool_handler, "wrapperProfileCallbackBegin"));
        g_profileHandler.profileCallbackEnd = reinterpret_cast<nvptxcompilerProfileCallbackEnd>(dlsym(tool_handler, "wrapperProfileCallbackEnd"));

        // register profile domain
        if (g_profileHandler.registerProfileDomain != NULL) {
            g_profileDomain = g_profileHandler.registerProfileDomain(gLibName, g_profileFunctionList, sizeof(g_profileFunctionList) / sizeof(g_profileFunctionList[0]));
            if (g_profileDomain == 0) {
                g_profileHandler.isCallbackEnabled = NULL;
            }
        }
    }

  post_dlopen_tgt_lib: |
    InitializeProfileHandler();

  pre_wrapper_call: |
    bool needProfile = g_profileHandler.isCallbackEnabled != NULL &&
            g_profileHandler.isCallbackEnabled(g_profileDomain, nvptxcompiler_TRACE_CBID_$WRAPPER_FUNC_NAME) != 0;
        if (needProfile) {
            g_profileHandler.profileCallbackBegin(g_profileDomain, nvptxcompiler_TRACE_CBID_$WRAPPER_FUNC_NAME);
        }

  post_wrapper_call: |
    if (needProfile) {
            g_profileHandler.profileCallbackEnd(g_profileDomain, nvptxcompiler_TRACE_CBID_$WRAPPER_FUNC_NAME);
        }

