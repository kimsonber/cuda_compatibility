global_custom_code:
  loader_start: |
    static uint32_t g_profileDomain;

    static const char* g_profileFunctionList[] = {
        "cudnnCnnTrainVersionCheck",
        "cudnnConvolutionBackwardBias",
        "cudnnConvolutionBackwardFilter",
        "cudnnCreateFusedOpsConstParamPack",
        "cudnnCreateFusedOpsPlan",
        "cudnnCreateFusedOpsVariantParamPack",
        "cudnnDestroyFusedOpsConstParamPack",
        "cudnnDestroyFusedOpsPlan",
        "cudnnDestroyFusedOpsVariantParamPack",
        "cudnnFindConvolutionBackwardFilterAlgorithm",
        "cudnnFindConvolutionBackwardFilterAlgorithmEx",
        "cudnnFusedOpsExecute",
        "cudnnGetConvolutionBackwardFilterAlgorithmMaxCount",
        "cudnnGetConvolutionBackwardFilterAlgorithm_v7",
        "cudnnGetConvolutionBackwardFilterWorkspaceSize",
        "cudnnGetFusedOpsConstParamPackAttribute",
        "cudnnGetFusedOpsVariantParamPackAttribute",
        "cudnnMakeFusedOpsPlan",
        "cudnnSetFusedOpsConstParamPackAttribute",
        "cudnnSetFusedOpsVariantParamPackAttribute",
    };

    enum cudnn_cnn_trainProfileCallbackId {
        cudnn_cnn_train_TRACE_CBID_cudnnCnnTrainVersionCheck = 0,
        cudnn_cnn_train_TRACE_CBID_cudnnConvolutionBackwardBias = 1,
        cudnn_cnn_train_TRACE_CBID_cudnnConvolutionBackwardFilter = 2,
        cudnn_cnn_train_TRACE_CBID_cudnnCreateFusedOpsConstParamPack = 3,
        cudnn_cnn_train_TRACE_CBID_cudnnCreateFusedOpsPlan = 4,
        cudnn_cnn_train_TRACE_CBID_cudnnCreateFusedOpsVariantParamPack = 5,
        cudnn_cnn_train_TRACE_CBID_cudnnDestroyFusedOpsConstParamPack = 6,
        cudnn_cnn_train_TRACE_CBID_cudnnDestroyFusedOpsPlan = 7,
        cudnn_cnn_train_TRACE_CBID_cudnnDestroyFusedOpsVariantParamPack = 8,
        cudnn_cnn_train_TRACE_CBID_cudnnFindConvolutionBackwardFilterAlgorithm = 9,
        cudnn_cnn_train_TRACE_CBID_cudnnFindConvolutionBackwardFilterAlgorithmEx = 10,
        cudnn_cnn_train_TRACE_CBID_cudnnFusedOpsExecute = 11,
        cudnn_cnn_train_TRACE_CBID_cudnnGetConvolutionBackwardFilterAlgorithmMaxCount = 12,
        cudnn_cnn_train_TRACE_CBID_cudnnGetConvolutionBackwardFilterAlgorithm_v7 = 13,
        cudnn_cnn_train_TRACE_CBID_cudnnGetConvolutionBackwardFilterWorkspaceSize = 14,
        cudnn_cnn_train_TRACE_CBID_cudnnGetFusedOpsConstParamPackAttribute = 15,
        cudnn_cnn_train_TRACE_CBID_cudnnGetFusedOpsVariantParamPackAttribute = 16,
        cudnn_cnn_train_TRACE_CBID_cudnnMakeFusedOpsPlan = 17,
        cudnn_cnn_train_TRACE_CBID_cudnnSetFusedOpsConstParamPackAttribute = 18,
        cudnn_cnn_train_TRACE_CBID_cudnnSetFusedOpsVariantParamPackAttribute = 19,
    };

    typedef uint32_t (*cudnn_cnn_trainRegisterProfileDomain)(const char* domain_name, const char** function_list, uint32_t function_number);
    typedef uint8_t (*cudnn_cnn_trainIsProfileCallbackEnabled)(uint32_t domain, uint32_t callback_id);
    typedef void (*cudnn_cnn_trainProfileCallbackBegin)(uint32_t domain, uint32_t callback_id);
    typedef void (*cudnn_cnn_trainProfileCallbackEnd)(uint32_t domain, uint32_t callback_id);

    struct cudnn_cnn_trainProfileHandler {
        cudnn_cnn_trainRegisterProfileDomain registerProfileDomain;
        cudnn_cnn_trainIsProfileCallbackEnabled isCallbackEnabled;
        cudnn_cnn_trainProfileCallbackBegin profileCallbackBegin;
        cudnn_cnn_trainProfileCallbackEnd profileCallbackEnd;
    };

    static cudnn_cnn_trainProfileHandler g_profileHandler;
    static bool gDirectReturn = false;
    static const char* gLibName = "cudnn_cnn_train";

    static void InitializeProfileHandler() {
        // get library patch
        const char* profile_tool_library = getenv("WRAPPER_INJECTION_PATH");
        if (profile_tool_library == NULL) {
            return;
        }

        // open profile library
        void* tool_handler = dlopen(profile_tool_library, RTLD_LAZY);
        if (!tool_handler) {
            printf("cannot open the file:%s  with error %s\n", profile_tool_library, dlerror());
            return;
        }

        // init profile handler
        g_profileHandler.registerProfileDomain = reinterpret_cast<cudnn_cnn_trainRegisterProfileDomain>(dlsym(tool_handler, "wrapperRegisterProfileDomain"));
        g_profileHandler.isCallbackEnabled = reinterpret_cast<cudnn_cnn_trainIsProfileCallbackEnabled>(dlsym(tool_handler, "wrapperIsProfileCallbackEnabled"));
        g_profileHandler.profileCallbackBegin = reinterpret_cast<cudnn_cnn_trainProfileCallbackBegin>(dlsym(tool_handler, "wrapperProfileCallbackBegin"));
        g_profileHandler.profileCallbackEnd = reinterpret_cast<cudnn_cnn_trainProfileCallbackEnd>(dlsym(tool_handler, "wrapperProfileCallbackEnd"));

        // register profile domain
        if (g_profileHandler.registerProfileDomain != NULL) {
            g_profileDomain = g_profileHandler.registerProfileDomain(gLibName, g_profileFunctionList, sizeof(g_profileFunctionList) / sizeof(g_profileFunctionList[0]));
            if (g_profileDomain == 0) {
                g_profileHandler.isCallbackEnabled = NULL;
            }
        }
    }

  post_dlopen_tgt_lib: |
    InitializeProfileHandler();

  pre_wrapper_call: |
    bool needProfile = g_profileHandler.isCallbackEnabled != NULL &&
            g_profileHandler.isCallbackEnabled(g_profileDomain, cudnn_cnn_train_TRACE_CBID_$WRAPPER_FUNC_NAME) != 0;
        if (needProfile) {
            g_profileHandler.profileCallbackBegin(g_profileDomain, cudnn_cnn_train_TRACE_CBID_$WRAPPER_FUNC_NAME);
        }

  post_wrapper_call: |
    if (needProfile) {
            g_profileHandler.profileCallbackEnd(g_profileDomain, cudnn_cnn_train_TRACE_CBID_$WRAPPER_FUNC_NAME);
        }

